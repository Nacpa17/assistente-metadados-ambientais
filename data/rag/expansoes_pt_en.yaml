# Expansão de consulta PORTUGUÊS -> INGLÊS para a busca léxica do RAG.
#
# Por quê: as perguntas chegam em português ("dados de umidade em SGP"), mas os
# metadados ARM estão em inglês ("humidity", "relative_humidity"). Sem ponte, o
# BM25 não liga uma coisa à outra. Cada palavra da pergunta que aparece aqui é
# acrescentada à busca com os equivalentes em inglês (com peso menor que o das
# palavras originais).
#
# Edite à vontade (como o glossary.yaml): uma palavra por chave, sem se
# preocupar com acentos ou maiúsculas — tudo é normalizado. Depois de editar,
# reconstrua o índice:  python -m assistente_metadados.rag.build_index
termos:
  umidade: [humidity, moisture, rh]
  temperatura: [temperature, temp]
  pressao: [pressure, pres]
  vento: [wind]
  ventos: [wind]
  velocidade: [velocity, speed]
  direcao: [direction]
  chuva: [precipitation, rain, rainfall]
  chuvas: [precipitation, rain]
  precipitacao: [precipitation, precip, rain]
  nuvem: [cloud]
  nuvens: [cloud, clouds]
  nebulosidade: [cloud, fraction]
