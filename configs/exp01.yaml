# Experimento de fine-tuning — fase 2 (dataset v3.1 com glossário + negativos).
#
# MUDANÇAS de velocidade em relação à versão anterior (o treino estava lento):
#   - max_length: 768 -> 512   (a mais importante: alivia a VRAM da RTX 4050 e
#                               evita "vazar" para a RAM, que era o que deixava
#                               ~24 s/it; suas respostas quase nunca passam de
#                               512 tokens, então a perda de informação é mínima)
#   - eval_split:  0.05 -> 0.02 (validação menor => cada avaliação mais rápida)
#   - eval_steps:  200  -> 500  (avalia com menos frequência)
#   - save_steps:  200  -> 500  (checkpoint junto com a avaliação)
#
# O QUE NÃO MUDOU (de propósito):
#   - learning_rate = 2e-4  -> padrão para LoRA. Baixar para 5e-5 (como sugerido
#     em algumas análises) NÃO corrige as alucinações de fato; ao contrário,
#     deixa a memorização mais LENTA. O modelo alucinava porque tinha visto
#     cada exemplo só ~0,36 vez (12% do treino), não por LR alto.
#   - num_train_epochs = 3 -> a tarefa é essencialmente MEMORIZAR uma base de
#     conhecimento; para isso queremos MAIS passagens, não menos. O eval_loss
#     ainda estava caindo (1.09 -> 0.54) quando você pausou, sem sinal de
#     overfitting. Reduzir para 1-1.5 época daria um modelo PIOR de recordação.

experiment_name: "exp01_llama2_v3"
seed: 42

model:
  base: "meta-llama/Llama-2-7b-chat-hf"
  output_dir: "checkpoints/exp01"      # NÃO aponte para um checkpoint-XXXX aqui;
                                        # isso quebra o salvamento. Para retomar,
                                        # use a flag --resume (veja o README).
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"    # use "float16" se a GPU não suportar bf16
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

dataset:
  path: "data/processed/dataset_v3.jsonl"
  eval_split: 0.02
  max_length: 512
  shuffle_seed: 42

system_prompt: |
  Você é um assistente técnico de instrumentação atmosférica especializado
  em metadados ambientais. Sempre responda em português, de forma objetiva
  e precisa. Se a informação não estiver disponível, diga isso claramente
  em vez de inventar.

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: ["none"]
  run_name: "exp01_llama2_v3"

generation:
  max_new_tokens: 256
  temperature: 0.2
  top_p: 0.9
  repetition_penalty: 1.05

# RAG — fase 3 (arquitetura híbrida fine-tuning + recuperação).
# Monte o índice antes:  python -m assistente_metadados.rag.build_index
# Ligue na avaliação com --rag, no chat com --rag e na API com IC_RAG=1
# (ou enabled: true aqui).
rag:
  enabled: false
  index_path: "data/rag/index.json"
  top_k: 3                  # fichas no contexto
  max_context_chars: 5000   # ~1.300-1.600 tokens de contexto
  max_input_tokens: 3072    # LLaMA 2 = 4096 tokens; sobra espaço p/ resposta
  min_score: 0.0            # 0 = sem corte; calibre com assistente_metadados.rag.eval_retrieval
  expand_pt_en: true        # umidade -> humidity (data/rag/expansoes_pt_en.yaml)
