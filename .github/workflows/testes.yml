# Testes automáticos a cada push / pull request.
# Não precisa de GPU nem de modelo: só o RAG, as métricas, a coleta (com
# servidor ARM falso) e a auditoria. Leva menos de 1 minuto.
name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o pacote e as dependências de teste (sem torch/transformers)
        run: python -m pip install -e ".[dev]"
      - name: Sintaxe de todos os módulos
        run: python -m compileall -q assistente_metadados tests
      - name: Testes
        run: python -m pytest -q
